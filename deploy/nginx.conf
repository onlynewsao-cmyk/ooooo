# Próxima Encarnação — nginx à frente de 2 nós (gerado por tools/gen_cluster.py)
worker_processes auto;
events { worker_connections 16384; multi_accept on; }
http {
  include       /etc/nginx/mime.types;
  sendfile on; tcp_nopush on; keepalive_timeout 30; keepalive_requests 10000;
  gzip on; gzip_comp_level 5; gzip_min_length 1400;
  gzip_types application/javascript text/css application/json image/svg+xml text/plain;
  client_max_body_size 2m;
  # proteção básica contra abuso / DDoS de camada 7
  limit_req_zone $binary_remote_addr zone=api:20m rate=12r/s;
  limit_req_zone $binary_remote_addr zone=conta:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=ip:10m;

upstream pe_n1 { server 127.0.0.1:8101; keepalive 64; }
upstream pe_n2 { server 127.0.0.1:8102; keepalive 64; }

  map $arg_sh $pe_node {
    default pe_n1;
    "1" pe_n1;
    "2" pe_n2;
    "3" pe_n1;
    "4" pe_n2;
    "5" pe_n1;
    "6" pe_n2;
    "7" pe_n1;
    "8" pe_n2;
    "9" pe_n1;
    "10" pe_n2;
    "11" pe_n1;
    "12" pe_n2;
    "13" pe_n1;
    "14" pe_n2;
    "15" pe_n1;
    "16" pe_n2;
    "17" pe_n1;
    "18" pe_n2;
    "19" pe_n1;
    "20" pe_n2;
    "21" pe_n1;
    "22" pe_n2;
    "23" pe_n1;
    "24" pe_n2;
    "25" pe_n1;
    "26" pe_n2;
    "27" pe_n1;
    "28" pe_n2;
    "29" pe_n1;
    "30" pe_n2;
    "31" pe_n1;
    "32" pe_n2;
    "33" pe_n1;
    "34" pe_n2;
    "35" pe_n1;
    "36" pe_n2;
    "37" pe_n1;
    "38" pe_n2;
    "39" pe_n1;
    "40" pe_n2;
    "41" pe_n1;
    "42" pe_n2;
    "43" pe_n1;
    "44" pe_n2;
    "45" pe_n1;
    "46" pe_n2;
    "47" pe_n1;
    "48" pe_n2;
    "49" pe_n1;
    "50" pe_n2;
    "51" pe_n1;
    "52" pe_n2;
    "53" pe_n1;
    "54" pe_n2;
    "55" pe_n1;
    "56" pe_n2;
    "57" pe_n1;
    "58" pe_n2;
    "59" pe_n1;
    "60" pe_n2;
    "61" pe_n1;
    "62" pe_n2;
    "63" pe_n1;
    "64" pe_n2;
    "65" pe_n1;
    "66" pe_n2;
    "67" pe_n1;
